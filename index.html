<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard & Pop-ups</title>
    <style>
        /* Grundlegendes Design */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #ffffff;
        }

        /* Buttons zum Öffnen */
        .btn-container {
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #238636;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: #2ea043;
        }

        button:active {
            transform: scale(0.98);
        }

        button.secondary {
            background-color: #21262d;
            border: 1px solid #30363d;
        }

        button.secondary:hover {
            background-color: #30363d;
        }

        /* --- CLEAN ANIMATED MODALS (POP-UPS) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            transform: scale(0.90) translateY(15px);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            opacity: 0;
        }

        /* Wenn das Pop-up aktiv ist */
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal h2 {
            margin-top: 0;
            color: #f0f6fc;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #8b949e;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #58a6ff;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .switch-text {
            font-size: 13px;
            color: #8b949e;
            cursor: pointer;
        }

        .switch-text:hover {
            color: #58a6ff;
            text-decoration: underline;
        }

        /* --- LEADERBOARD --- */
        .leaderboard-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            padding: 20px;
            box-sizing: border-box;
        }

        .leaderboard-card h3 {
            margin-top: 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            color: #f0f6fc;
        }

        .leaderboard-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-bottom: 1px solid #21262d;
            transition: background-color 0.2s ease;
        }

        .leaderboard-row:last-child {
            border-bottom: none;
        }

        .leaderboard-row:hover {
            background-color: #1f242c;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Der Farb-Punkt für die ausgerüstete Farbe auf dem Leaderboard */
        .color-indicator {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            box-shadow: 0 0 8px currentColor; /* Leichter Glow in Spielerfarbe */
        }

        .rank {
            font-weight: bold;
            color: #8b949e;
            width: 25px;
        }
    </style>
</head>
<body>

    <h1>Mein Web-Projekt</h1>

    <div class="btn-container">
        <button onclick="openModal('loginModal')">Anmelden</button>
        <button class="secondary" onclick="openModal('registerModal')">Registrieren</button>
    </div>

    <!-- LEADERBOARD -->
    <div class="leaderboard-card">
        <h3>Top Leaderboard</h3>
        <div id="leaderboardList">
            <!-- Wird dynamisch per JavaScript gefüllt, inklusive der ausgerüsteten Farbe -->
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div id="loginModal" class="modal-overlay" onclick="handleOverlayClick(event, 'loginModal')">
        <div class="modal">
            <h2>Anmelden</h2>
            <div class="form-group">
                <label>Benutzername</label>
                <input type="text" placeholder="Dein Name">
            </div>
            <div class="form-group">
                <label>Passwort</label>
                <input type="password" placeholder="••••••••">
            </div>
            <div class="modal-footer">
                <span class="switch-text" onclick="switchModal('loginModal', 'registerModal')">Noch kein Konto? Registrieren</span>
                <button onclick="closeModal('loginModal')">Einloggen</button>
            </div>
        </div>
    </div>

    <!-- REGISTRIERUNGS MODAL (Extra Fenster) -->
    <div id="registerModal" class="modal-overlay" onclick="handleOverlayClick(event, 'registerModal')">
        <div class="modal">
            <h2>Registrieren</h2>
            <div class="form-group">
                <label>Neuer Benutzername</label>
                <input type="text" placeholder="Dein Wunschname">
            </div>
            <div class="form-group">
                <label>Passwort wählen</label>
                <input type="password" placeholder="••••••••">
            </div>
            <div class="modal-footer">
                <span class="switch-text" onclick="switchModal('registerModal', 'loginModal')">Bereits ein Konto? Anmelden</span>
                <button onclick="closeModal('registerModal')">Registrieren</button>
            </div>
        </div>
    </div>

    <script>
        // Beispiel-Daten für das Leaderboard inklusive der aktuell ausgerüsteten Farbe
        const leaderboardData = [
            { rank: 1, name: "ShadowSniper", equippedColor: "#ff4757" }, // Rot
            { rank: 2, name: "PixelKing", equippedColor: "#2ed573" },    // Grün
            { rank: 3, name: "NeonRider", equippedColor: "#1e90ff" },    // Blau
            { rank: 4, name: "Blaze67", equippedColor: "#ffa502" }      // Orange
        ];

        // Leaderboard rendern und dabei die ausgerüstete Farbe anzeigen
        function renderLeaderboard() {
            const listContainer = document.getElementById('leaderboardList');
            listContainer.innerHTML = '';

            leaderboardData.forEach(player => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row';
                
                row.innerHTML = `
                    <div class="player-info">
                        <span class="rank">#${player.rank}</span>
                        <!-- Hier wird die aktuelle Farbe direkt im Leaderboard angezeigt -->
                        <span class="color-indicator" style="background-color: ${player.equippedColor}; color: ${player.equippedColor};"></span>
                        <span>${player.name}</span>
                    </div>
                `;
                listContainer.appendChild(row);
            });
        }

        // Pop-up öffnen mit cleaner Animation
        function openModal(modalId) {
            document.getElementById(modalId).classList.add('active');
        }

        // Pop-up schließen
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        // Sanftes Wechseln zwischen Login- und Registrierungs-Fenster
        function switchModal(currentId, targetId) {
            closeModal(currentId);
            setTimeout(() => {
                openModal(targetId);
            }, 150); // Kurze Verzögerung für einen fließenden Übergang
        }

        // Schließen, wenn man außerhalb des Pop-up-Fensters klickt
        function handleOverlayClick(event, modalId) {
            if (event.target.classList.contains('modal-overlay')) {
                closeModal(modalId);
            }
        }

        // Initial Leaderboard laden beim Start
        renderLeaderboard();
    </script>
</body>
</html>
